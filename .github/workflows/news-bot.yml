name: News bot CI and Oracle deployment

on:
  push:
    branches: [master]
    paths: ['mkr/**', '.github/workflows/news-bot.yml']
  pull_request:
    branches: [master]
    paths: ['mkr/**', '.github/workflows/news-bot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3.5:9b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r mkr/solution/requirements.txt -r mkr/solution/requirements-files.txt
      - name: Test bot without API keys
        run: python -m unittest discover -s mkr/solution -p 'test_*.py' -v
      - name: Test deployment safeguards
        run: python -m unittest discover -s mkr/deploy -p 'test_*.py' -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: oracle
    steps:
      - name: Deploy tested commit to Oracle
        env:
          DEPLOY_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo 'Add the ORACLE_SSH_KEY Actions secret to enable deployment.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/oracle_deploy_key"
          hosts_file="$RUNNER_TEMP/oracle_known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' '141.147.21.157 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF6QSbSjtf/EqE4rFVr76SBFeR2wrySveuaxXGlG7gm4' > "$hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            ubuntu@141.147.21.157 "deploy $DEPLOY_SHA"
